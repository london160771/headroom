# Every push: unit tests (including "page data rebuilds byte for byte from evidence/" and
# "THESIS.md matches the data"), `npm run verify` offline, the production build, and the
# anchor contract's Rust tests.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify -- --offline
      - run: npm run build
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
